<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>loader</title></head>
<body>
<script>
// Sends this folder's ad images to the parent window (Ads Manager) as Blobs.
// Only parents on facebook.com may receive them.
(async function () {
  var names = ["girl-4x5.jpg","boy-4x5.jpg","mom-4x5.jpg","girl-1x1.jpg","boy-1x1.jpg","mom-1x1.jpg"];
  var target = "https://adsmanager.facebook.com";
  for (var i = 0; i < names.length; i++) {
    try {
      var r = await fetch(names[i], { cache: "no-store" });
      var b = await r.blob();
      parent.postMessage({ __np: true, name: "NihasPicks-" + names[i], blob: b }, target);
    } catch (e) {
      parent.postMessage({ __np: true, error: String(e), name: names[i] }, target);
    }
  }
  parent.postMessage({ __np: true, done: true }, target);
})();
</script>
</body></html>
